<div class="app">

    <span class="line r"></span>
  </div>
  <main id="view" class="view" aria-live="off"><p class="empty center">加载中…</p></main>
  <nav class="tabs" aria-label="主导航">
    <a href="#/" data-tab="calendar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>日历</a>

  </nav>
</div>

<div id="toast" class="toast" role="status" hidden><span></span><button type="button">撤销</button></div>
